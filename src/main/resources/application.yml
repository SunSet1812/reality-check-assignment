server:
  port: 8080
  servlet:
    context-path: /reality-check

spring:
  application:
    name: reality-check-assignment
  datasource:
    url: jdbc:h2:mem:realitycheck;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      host: cache-server
      port: 6379

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /api-docs/swagger-ui

logging:
  level:
    com.comeon.assignment.realitycheck: INFO

scheduler-lock:
  enabled: true
